<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pi Workbench · 需求与进度</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--surface:#121820;--raised:#19212c;--line:#293445;--ink:#e6edf6;--muted:#a1aec0;--faint:#8090a6;--accent:#a5bbff;--blue:#708ee6;--ok:#75d7ad;--warn:#f0c478;--bad:#ffa8b6;--font:"Segoe UI","Microsoft YaHei",sans-serif;--mono:"Cascadia Code",Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 var(--font)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button,a,input,select,textarea{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent)}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 12px}button:hover{background:var(--raised);border-color:#526483}button:disabled{cursor:default;opacity:.5}input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}label{font-size:12px;color:var(--muted)}small{font-size:12px;color:var(--muted)}h1,h2,h3,p{margin:0}h1{font-size:25px;line-height:1.4;font-weight:650;letter-spacing:-.5px}h2{font-size:20px;font-weight:600}h3{font-size:15px;font-weight:600}.muted{color:var(--muted)}.faint{color:var(--faint)}.mono{font-family:var(--mono);font-size:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}[hidden]{display:none!important}
.top{padding:20px 28px 0;border-bottom:1px solid var(--line);background:var(--surface)}.topline{display:flex;gap:20px;align-items:flex-start;justify-content:space-between;max-width:1700px;margin:auto}.brand{display:flex;gap:12px;align-items:center}.mark{font:30px var(--font);height:43px;width:43px;border:1px solid #50669a;border-radius:10px;display:grid;place-items:center;color:var(--accent);flex:none}.subtitle{font-size:12px;color:var(--muted);margin-top:4px}.links{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;padding-top:9px}.tabs{display:flex;gap:22px;max-width:1700px;margin:18px auto 0;overflow:auto}.tabs button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 1px;white-space:nowrap;color:var(--muted)}.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.summary{max-width:1756px;margin:auto;padding:22px 28px 18px;display:grid;grid-template-columns:minmax(310px,1.1fr) minmax(300px,1fr);gap:32px;align-items:center}.progress-number{display:flex;align-items:baseline;gap:8px}.progress-number b{font-size:31px;line-height:1.4;font-weight:600;font-variant-numeric:tabular-nums}.progress-number span{color:var(--muted);font-size:13px}.progress-track{height:5px;background:var(--line);border-radius:4px;margin:10px 0 8px;overflow:hidden}.progress-fill{height:100%;background:var(--ok);width:0}.summary-meta{display:flex;gap:22px;margin-top:8px;font-size:12px;color:var(--muted)}.summary-meta strong{font-size:16px;color:var(--ink);font-weight:550;margin-right:5px}.baseline{border-left:2px solid #52689c;padding-left:16px;color:var(--muted);font-size:12px;max-width:700px}.baseline b{display:block;color:var(--ink);font-weight:550;margin-bottom:4px}
.workspace{display:grid;grid-template-columns:224px minmax(0,1fr);max-width:1756px;margin:0 auto;padding:0 28px 35px;gap:24px}.sidebar{border-right:1px solid var(--line);padding-right:15px;align-self:start;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}.sidebar h2{font-size:12px;color:var(--muted);font-weight:500;padding:10px 10px}.module{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;border-radius:6px;width:100%;text-align:left;background:none;padding:8px 10px;font-size:12px;color:var(--muted)}.module[aria-pressed=true]{background:#22304a;color:#dbe5ff}.module .count{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}.content{min-width:0}.stage-strip{display:flex;gap:7px;overflow:auto;padding:1px 0 14px}.stage-chip{border-radius:6px;padding:7px 10px;display:flex;gap:7px;align-items:center;white-space:nowrap;font-size:11px}.stage-chip[aria-pressed=true]{border-color:var(--blue);background:#202d44}.stage-chip span{color:var(--faint);font-variant-numeric:tabular-nums}.tools{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:15px}.search{flex:1;min-width:210px}.tools label{display:flex;flex-direction:column;gap:5px}.tools input{width:100%}.tools select{min-width:108px}.tools .actions{display:flex;gap:7px;margin-left:auto}.tools .actions button{font-size:12px;white-space:nowrap}.result-head{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:15px 0;font-size:12px;color:var(--muted)}.result-head button{padding:3px 8px;font-size:11px;background:none}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:9px}.features{border-collapse:collapse;width:100%;min-width:740px}.features th{background:var(--surface);color:var(--muted);font-size:11px;font-weight:500;padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}.features td{padding:11px 12px;border-bottom:1px solid #222d3b;vertical-align:top;font-size:12px}.features tr:last-child td{border-bottom:0}.features tbody tr:hover{background:#151e2a}.features .namecell{min-width:240px}.name-button{border:0;background:none;padding:0;text-align:left;border-radius:2px;line-height:1.5;color:var(--ink);font-size:13px;font-weight:550}.name-button:hover{background:none;border:0;color:var(--accent)}.row-summary{font-size:11px;color:var(--faint);margin-top:4px;max-width:520px}.id-cell{color:var(--faint);font-family:var(--mono);font-size:10px;margin-bottom:4px}.definition{font-size:10px;color:var(--faint);margin-top:5px;white-space:nowrap}.tag{font-size:10px;padding:2px 7px;display:inline-block;border:1px solid var(--line);border-radius:5px;white-space:nowrap;line-height:1.6;color:var(--muted)}.tag.verified{color:var(--ok);border-color:#366c59;background:#12251e}.tag.in_progress{color:#b6c9ff;border-color:#465d92;background:#1b2741}.tag.blocked{color:var(--bad);border-color:#74404f;background:#2c1b25}.tag.in_review{color:var(--warn);border-color:#6e5b36;background:#2b2519}.tag.deferred{color:#b3a9d2}.priority{font-family:var(--mono);font-size:11px;color:var(--muted)}.empty{padding:45px 20px;text-align:center;color:var(--muted)}.pager{display:flex;gap:12px;justify-content:flex-end;align-items:center;margin-top:15px;font-size:12px;color:var(--muted)}.pager button{padding:5px 12px;font-size:12px}.footnote{font-size:11px;color:var(--faint);padding-top:15px;max-width:900px}.storage-note{font-size:11px;color:var(--muted);min-height:18px;margin-top:7px}.storage-note.warning{color:var(--warn)}
.document-view{max-width:1450px;margin:0 auto;padding:0 28px 45px}.document-intro{margin:5px 0 24px;max-width:900px;color:var(--muted);font-size:13px}.milestone{border-top:1px solid var(--line);padding:22px 0;display:grid;grid-template-columns:185px minmax(0,1fr);gap:28px}.milestone-id{font:13px var(--mono);color:var(--accent)}.milestone h3{font-size:18px;margin:4px 0 8px}.milestone .bar{height:4px;background:var(--line);margin:12px 0;max-width:140px}.milestone .bar i{display:block;height:100%;background:var(--ok)}.milestone p{color:var(--muted);font-size:13px}.milestone ul{margin:10px 0;padding-left:20px;color:#c0cbd9;font-size:13px}.milestone button{font-size:11px;margin-top:10px}.decision{padding:20px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:58px minmax(0,1fr);gap:16px}.decision h3{margin-bottom:7px}.decision p{max-width:1030px;color:var(--muted);font-size:13px}.question{border-left:2px solid #705d3e;padding:5px 0 5px 15px;margin:18px 0}.question p{font-size:12px;color:var(--muted);margin-top:5px}.guide{max-width:1000px}.guide h3{margin:26px 0 10px}.guide p,.guide li{font-size:13px;color:var(--muted)}.guide code{font:12px var(--mono);color:#c6d2e9}.guide pre{padding:15px;overflow:auto;border:1px solid var(--line);border-radius:7px}.source{margin:12px 0;font-size:13px}.source p{font-size:12px;margin-top:4px}.source .path{overflow-wrap:anywhere;font:11px var(--mono);color:var(--faint)}
dialog{color:var(--ink);background:var(--surface);border:1px solid #445471;border-radius:12px;width:min(760px,calc(100vw - 28px));max-height:calc(100vh - 30px);padding:0;box-shadow:0 20px 80px #0008}dialog::backdrop{background:#060a10b8}.detail-head{position:sticky;top:0;background:var(--surface);z-index:1;padding:20px 24px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px}.detail-head h2{font-size:19px;margin-top:4px}.detail-head button{padding:4px 10px;font-size:12px;align-self:flex-start}.detail-content{padding:20px 24px}.detail-content>p{font-size:13px;color:var(--muted);margin-bottom:16px}.detail-facts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.detail-section{margin:20px 0}.detail-section h3{font-size:13px;margin-bottom:10px}.dependency{font:11px var(--mono);padding:3px 7px;margin:0 5px 5px 0}.dependency.done{color:var(--ok)}.criterion{display:flex;gap:10px;align-items:flex-start;margin:10px 0;color:#c9d4e2;font-size:13px}.criterion input{margin:5px 0 0;accent-color:var(--blue);width:16px;height:16px;flex:none}.detail-form{border-top:1px solid var(--line);padding-top:18px}.field-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field textarea{min-height:76px;resize:vertical;line-height:1.6}.field .help{font-size:11px;color:var(--faint)}.form-error{color:var(--bad);font-size:12px;white-space:pre-line;margin-bottom:12px}.detail-footer{position:sticky;bottom:0;padding:14px 24px;border-top:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:12px}.primary{background:#bdcdff;color:#142141;border-color:#bdcdff;font-weight:600}.primary:hover{background:#d1dcff;border-color:#d1dcff}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);border:1px solid #576887;background:var(--raised);padding:11px 18px;border-radius:8px;font-size:12px;max-width:min(650px,90vw);z-index:10;box-shadow:0 8px 30px #0007;white-space:pre-line}
@media(min-width:1700px){.workspace{grid-template-columns:240px minmax(0,1fr)}}
@media(max-width:1000px){.top{padding:18px 18px 0}.summary{padding:20px 18px;gap:22px}.workspace{padding:0 18px 30px;grid-template-columns:185px minmax(0,1fr);gap:16px}.links{max-width:300px;justify-content:flex-end}.tools .actions{margin-left:0}.document-view{padding:0 18px 35px}}
@media(max-width:720px){h1{font-size:20px}.topline{display:block}.links{max-width:none;justify-content:flex-start;gap:15px;margin-top:9px}.top{padding:16px 14px 0}.tabs{gap:22px;margin-top:10px}.summary{display:block;padding:18px 14px}.baseline{margin-top:18px}.workspace{display:block;padding:0 14px 25px}.sidebar{position:static;max-height:none;overflow:visible;border:0;padding:0 0 14px}.sidebar h2{padding:0 0 8px}.modules{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.module{width:auto;flex:none;border:1px solid var(--line);padding:6px 9px}.module .count{margin-left:3px}.tools{gap:8px}.search{flex-basis:100%}.tools label{flex:1}.tools .actions{width:100%;padding-top:4px}.tools .actions button{flex:1}.tools select{width:100%;min-width:0}.row-summary{max-width:350px}.result-head{align-items:flex-start}.document-view{padding:0 14px 30px}.milestone{grid-template-columns:1fr;gap:12px;padding:20px 0}.milestone .bar{max-width:100%}.decision{grid-template-columns:42px 1fr;gap:8px}.field-row{grid-template-columns:1fr}.detail-head,.detail-content{padding:16px}.detail-footer{padding:12px 16px;align-items:flex-start}.detail-footer small{max-width:180px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media print{body{background:#fff;color:#111}.top,.summary,.sidebar,.tools,.stage-strip,.tabs,.pager,.toast,dialog{display:none!important}.workspace{display:block;padding:0}.features{min-width:0}.features th,.features td{background:#fff;color:#111}.table-wrap{border:0}.row-summary,.id-cell,.definition{color:#444}a{color:#111}.document-view{padding:0}.milestone,.decision{break-inside:avoid}}
</style>
</head>
<body>
<header class="top">
  <div class="topline"><div class="brand"><div class="mark" aria-hidden="true">π</div><div><h1>Pi Workbench 需求与进度</h1><p class="subtitle">完整能力范围、阶段依赖与验收记录</p></div></div><nav class="links" aria-label="关联文档"><a href="plan.md">全量产品规划</a><a href="prd.html">核心交互 PRD</a><a href="../architecture/overview.html">架构方案</a></nav></div>
  <nav class="tabs" role="tablist" aria-label="规划视图"><button type="button" id="tab-features" role="tab" aria-selected="true" aria-controls="view-features" data-view="features">功能清单</button><button type="button" id="tab-stages" role="tab" aria-selected="false" aria-controls="view-stages" data-view="stages" tabindex="-1">交付阶段</button><button type="button" id="tab-decisions" role="tab" aria-selected="false" aria-controls="view-decisions" data-view="decisions" tabindex="-1">产品决定与待定项</button><button type="button" id="tab-guide" role="tab" aria-selected="false" aria-controls="view-guide" data-view="guide" tabindex="-1">进度规则与来源</button></nav>
</header>
<section class="summary" aria-label="产品实现进度"><div><div class="progress-number"><b id="progressCount">—</b><span>本地完整版已验收</span><span id="progressPercent"></span></div><div class="progress-track" role="progressbar" aria-label="本地完整版验收进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="globalProgress"><div class="progress-fill" id="progressFill"></div></div><div class="summary-meta" id="summaryMeta"></div></div><p class="baseline"><b id="baselineTitle"></b><span id="baselineText"></span></p></section>
<main>
<section id="view-features" role="tabpanel" aria-labelledby="tab-features" class="workspace">
  <aside class="sidebar"><h2>能力模块</h2><nav id="modules" class="modules" aria-label="筛选功能模块"></nav></aside>
  <div class="content"><nav class="stage-strip" id="stageStrip" aria-label="筛选交付阶段"></nav>
  <div class="tools"><label class="search" for="search">查找功能<input type="search" id="search" placeholder="功能、编号、验收条件或依赖…" autocomplete="off"></label><label for="statusFilter">实现状态<select id="statusFilter"><option value="">全部状态</option></select></label><label for="priorityFilter">优先级<select id="priorityFilter"><option value="">全部</option><option value="P0">P0 关键基础</option><option value="P1">P1 完整能力</option><option value="P2">P2 可选探索</option></select></label><label for="definitionFilter">设计状态<select id="definitionFilter"><option value="">全部设计</option><option value="detailed">已有详细设计</option><option value="outline">待进一步细化</option></select></label><div class="actions"><button type="button" id="importButton">导入进度</button><button type="button" id="exportButton">导出最新总表</button><input id="importInput" type="file" accept="application/json,.json" hidden></div></div>
  <p id="storageNote" class="storage-note" role="status"></p><div class="result-head"><span id="resultCount" aria-live="polite"></span><button type="button" id="clearFilters">清除筛选</button></div>
  <div class="table-wrap"><table class="features"><thead><tr><th scope="col">功能 / 范围</th><th scope="col">交付阶段</th><th scope="col">优先级</th><th scope="col">实现进度</th><th scope="col">前置依赖</th></tr></thead><tbody id="featureRows"></tbody></table><div id="emptyState" class="empty" hidden><p>没有符合条件的功能。</p><small>可以更换关键词，或清除筛选查看完整范围。</small></div></div>
  <nav class="pager" aria-label="功能列表分页"><span id="pageInfo"></span><button type="button" id="previousPage">上一页</button><button type="button" id="nextPage">下一页</button></nav><p class="footnote">点击功能查看详细范围、依赖和验收项。M8 候选扩展单列，不计入本地完整版完成率；完成率按条目计数，不能视为工时完成率。页面内进度保存在当前浏览器，导出后可回写项目数据源。</p></div>
</section>
<section id="view-stages" role="tabpanel" aria-labelledby="tab-stages" class="document-view" hidden></section>
<section id="view-decisions" role="tabpanel" aria-labelledby="tab-decisions" class="document-view" hidden></section>
<section id="view-guide" role="tabpanel" aria-labelledby="tab-guide" class="document-view guide" hidden></section>
</main>
<dialog id="detailDialog" aria-labelledby="detailTitle"><form id="detailForm"><div class="detail-head"><div><div class="mono faint" id="detailId"></div><h2 id="detailTitle"></h2></div><button type="button" id="closeDetail" aria-label="关闭功能详情">关闭</button></div><div class="detail-content" id="detailContent"></div><div class="detail-footer"><small>全部验收项通过并记录证据后，才能标记已验收。</small><button type="submit" class="primary">保存进度</button></div></form></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:24px">此看板需要 JavaScript。也可打开 <a href="feature-list.md">完整 Markdown 功能清单</a>。</p></noscript>
